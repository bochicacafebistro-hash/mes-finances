<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Mes Finances</title>
  <meta name="description" content="Application personnelle de gestion des finances."/>
  <meta name="robots" content="noindex, nofollow"/>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Mes Finances"/>
  <meta name="mobile-web-app-capable" content="yes"/>

  <!-- Icônes -->
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png"/>
  <link rel="apple-touch-icon" sizes="192x192" href="images/icon-192.png"/>

  <!-- Polices : Bricolage Grotesque (titres, montants) + Figtree (interface) -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet"/>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css"/>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Chart.js pour graphiques dashboard -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="login-screen"></div>

<div id="app-shell" style="display:none">
  <div class="app">
    <!-- Barre latérale (ordi) / rail (tablette) — remplie par buildSidebar() -->
    <aside class="app-sidebar" id="sidebar" aria-label="Navigation principale"></aside>

    <!-- Contenu -->
    <main class="app-main" id="main-area">
      <div id="page-content"></div>
    </main>

    <!-- Barre d'onglets (cellulaire) -->
    <nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>
  </div>
</div>

<div id="toast-root" aria-live="polite"></div>
<div id="modals"></div>

<!-- Scripts (ordre critique !) -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/icons.js"></script>
<script src="js/i18n.js"></script>
<script src="js/utils.js"></script>
<script src="js/pages.js"></script>
<script src="js/centris-parser.js"></script>
<script src="js/duproprio-parser.js"></script>
<script src="js/house-page.js"></script>
<script src="js/quick-add.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/auth.js"></script>
<script src="js/firebase-listeners.js"></script>

<!-- Init + PWA Service Worker -->
<script>
  document.documentElement.lang = getUILang() === "es" ? "es" : "fr-CA";
  initDark();
  // Raccourcis PWA : ?page=transactions, ?add=expense
  (function () {
    const q = new URLSearchParams(location.search);
    const p = q.get("page");
    if (p && ["dashboard","transactions","budget","accounts","subscriptions","realestate","house","categories"].includes(p)) activePage = p;
    window._startQuickAdd = q.get("add");
  })();
  if (!restoreSession()) showLogin();
  else if (window._startQuickAdd) setTimeout(() => openQuickAdd(window._startQuickAdd === "income" ? "income" : "expense"), 300);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('PWA: SW échec', err));
    });
  }
</script>

</body>
</html>
