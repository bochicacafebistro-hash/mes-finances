<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Mes Finances</title>
  <meta name="description" content="Application personnelle de gestion des finances."/>
  <meta name="robots" content="noindex, nofollow"/>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Mes Finances"/>
  <meta name="mobile-web-app-capable" content="yes"/>

  <!-- Icônes -->
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png"/>
  <link rel="apple-touch-icon" sizes="192x192" href="images/icon-192.png"/>

  <!-- Polices (Crystalline : Geist + Geist Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet"/>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css"/>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Chart.js pour graphiques dashboard -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="login-screen"></div>

<div id="app-shell" style="display:none">
  <div class="cr-app">

    <!-- HEADER HORIZONTAL (Crystalline) -->
    <header class="cr-header" id="sidebar" aria-label="Navigation principale">
      <div class="cr-header__left">
        <div class="cr-logo">
          <div class="cr-logo__mark" aria-hidden="true"></div>
          <span class="cr-logo__text">MesFinances</span>
        </div>
        <nav class="cr-nav" id="sidebar-nav" aria-label="Sections"></nav>
      </div>
      <div class="cr-header__right">
        <button class="cr-icon-btn" onclick="toggleDark()" id="dark-btn" aria-label="Mode sombre"></button>
        <button class="cr-icon-btn" onclick="toggleUILang()" id="lang-btn" aria-label="Langue"></button>
        <button class="cr-icon-btn cr-icon-btn--text" onclick="logout()" id="logout-btn" aria-label="Déconnexion"></button>
        <button class="cr-icon-btn cr-mobile-menu" onclick="toggleSidebar()" id="sidebar-toggle-btn" aria-label="Menu"></button>
      </div>
    </header>

    <!-- MAIN -->
    <main class="cr-main" id="main-area">
      <div id="page-content"></div>
    </main>

  </div>
</div>

<div id="modals"></div>

<!-- Scripts (ordre critique !) -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/icons.js"></script>
<script src="js/i18n.js"></script>
<script src="js/utils.js"></script>
<script src="js/pages.js"></script>
<script src="js/centris-parser.js"></script>
<script src="js/duproprio-parser.js"></script>
<script src="js/house-page.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/auth.js"></script>
<script src="js/firebase-listeners.js"></script>

<!-- Init + PWA Service Worker -->
<script>
  document.documentElement.lang = getUILang() === "es" ? "es" : "fr-CA";
  initDark();
  document.getElementById("sidebar-toggle-btn").innerHTML = icon("menu", 18);
  // Le logout-btn est rempli par buildSidebar() (avatar avec initiale)
  if (!restoreSession()) showLogin();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('PWA: SW échec', err));
    });
  }
</script>

</body>
</html>
